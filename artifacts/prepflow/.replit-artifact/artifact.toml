kind = "web"
previewPath = "/"
title = "PrepFlow AI"
version = "1.0.0"
id = "artifacts/prepflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23488

[services.development]
run = "pnpm --filter @workspace/prepflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prepflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/prepflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23488"
BASE_PATH = "/"
